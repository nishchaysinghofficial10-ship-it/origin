name: origin-beta

services:
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ORIGIN_BETA_HOST: ${ORIGIN_BETA_HOST:?set ORIGIN_BETA_HOST to the public API hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: origin-beta:2.1.2-web-beta
    build: .
    command: ["python", "-m", "origin_web", "api"]
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - origin-beta-data:/data
    expose: ["8080"]
    environment:
      ORIGIN_WEB_BETA_TOKEN_FILE: /run/secrets/beta_token
      ORIGIN_WEB_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      ORIGIN_WEB_SITE_DIR: /app/public
      ORIGIN_WEB_ALLOWED_ORIGINS: ${ORIGIN_PUBLIC_SITE_ORIGIN:?set the exact HTTPS site origin}
      ORIGIN_WEB_PUBLIC_SITE_URL: ${ORIGIN_PUBLIC_SITE_ORIGIN:?set the exact HTTPS site origin}
      ORIGIN_WEB_ACCEPT_JOBS: ${ORIGIN_WEB_ACCEPT_JOBS:-1}
      ORIGIN_WEB_GENERAL_RESEARCH: ${ORIGIN_WEB_GENERAL_RESEARCH:-0}
      ORIGIN_GENERAL_MISSIONS_PER_DAY: ${ORIGIN_GENERAL_MISSIONS_PER_DAY:-2}
      ORIGIN_PROVIDER_MISSIONS_PER_DAY: ${ORIGIN_PROVIDER_MISSIONS_PER_DAY:-4}
      ORIGIN_PROVIDER_CALLS_PER_MISSION: ${ORIGIN_PROVIDER_CALLS_PER_MISSION:-1}
      ORIGIN_WEB_SEARCHES_PER_MISSION: ${ORIGIN_WEB_SEARCHES_PER_MISSION:-3}
      ORIGIN_RESEARCH_MAX_OUTPUT_TOKENS: ${ORIGIN_RESEARCH_MAX_OUTPUT_TOKENS:-3200}
      ORIGIN_RESEARCH_TIMEOUT_S: ${ORIGIN_RESEARCH_TIMEOUT_S:-120}
      ORIGIN_RESEARCH_MODEL: ${ORIGIN_RESEARCH_MODEL:-claude-sonnet-4-6}
    secrets:
      - source: beta_token
        target: beta_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: admin_token
        target: admin_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks: [edge]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    image: origin-beta:2.1.2-web-beta
    build: .
    command: ["python", "-m", "origin_web", "worker"]
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - origin-beta-data:/data
    environment:
      ORIGIN_WEB_ACCEPT_JOBS: ${ORIGIN_WEB_ACCEPT_JOBS:-1}
    healthcheck:
      test: ["CMD", "python", "-m", "origin_web.worker", "--health-check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  researcher:
    image: origin-beta:2.1.2-web-beta
    build: .
    command: ["python", "-m", "origin_web", "researcher"]
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - origin-beta-data:/data
    environment:
      ORIGIN_WEB_GENERAL_RESEARCH: ${ORIGIN_WEB_GENERAL_RESEARCH:-0}
      ORIGIN_GENERAL_MISSIONS_PER_DAY: ${ORIGIN_GENERAL_MISSIONS_PER_DAY:-2}
      ORIGIN_PROVIDER_MISSIONS_PER_DAY: ${ORIGIN_PROVIDER_MISSIONS_PER_DAY:-4}
      ORIGIN_PROVIDER_CALLS_PER_MISSION: ${ORIGIN_PROVIDER_CALLS_PER_MISSION:-1}
      ORIGIN_WEB_SEARCHES_PER_MISSION: ${ORIGIN_WEB_SEARCHES_PER_MISSION:-3}
      ORIGIN_RESEARCH_MAX_OUTPUT_TOKENS: ${ORIGIN_RESEARCH_MAX_OUTPUT_TOKENS:-3200}
      ORIGIN_RESEARCH_TIMEOUT_S: ${ORIGIN_RESEARCH_TIMEOUT_S:-120}
      ORIGIN_RESEARCH_MODEL: ${ORIGIN_RESEARCH_MODEL:-claude-sonnet-4-6}
      ORIGIN_ANTHROPIC_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - source: anthropic_api_key
        target: anthropic_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks: [research]
    healthcheck:
      test: ["CMD", "python", "-m", "origin_web.researcher", "--health-check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backup:
    image: origin-beta:2.1.2-web-beta
    build: .
    profiles: [ops]
    entrypoint: ["python", "-m", "origin_web.backup"]
    command: ["--help"]
    healthcheck:
      disable: true
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - origin-beta-data:/data:ro
      - origin-beta-backups:/backup
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50

networks:
  edge:
  research:

volumes:
  origin-beta-data:
    name: ${ORIGIN_DATA_VOLUME:-origin-beta-data}
  origin-beta-backups:
    name: ${ORIGIN_BACKUP_VOLUME:-origin-beta-backups}
  caddy-data:
    name: ${ORIGIN_CADDY_DATA_VOLUME:-origin-beta-caddy-data}
  caddy-config:
    name: ${ORIGIN_CADDY_CONFIG_VOLUME:-origin-beta-caddy-config}

secrets:
  beta_token:
    environment: ORIGIN_BETA_TOKEN_SECRET
  admin_token:
    environment: ORIGIN_ADMIN_TOKEN_SECRET
  anthropic_api_key:
    environment: ORIGIN_ANTHROPIC_API_KEY_SECRET
