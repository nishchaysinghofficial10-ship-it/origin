name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - runner: macos-14
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter and OS
        run: |
          python -VV
          uname -a
          python -c "import os; print('cpu_count', os.cpu_count())"
      - name: Confirm ORIGIN needs no third-party packages
        run: |
          pip list --format=freeze > /tmp/before.txt
          python -c "import origin, origin.cli, origin.sandbox; print('import ok')"
          diff <(pip list --format=freeze) /tmp/before.txt
      - name: Full test suite
        run: python -m unittest discover -s tests -v

  portability:
    name: portability (relocated + archived artifacts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: No machine-specific absolute paths in artifacts
        run: python tools/check_artifacts_portable.py .

      - name: Shipped example missions verify in place
        run: |
          python -m origin verify --dir examples/flagship_run
          python -m origin verify --dir examples/demo_run

      - name: Performance-reproducibility guarantees on the shipped flagship
        run: |
          set -euo pipefail
          EXP=$(python -c 'from origin.state import ResearchState; st = ResearchState.load("examples/flagship_run"); print(next(r.id for r in st.experiments.values() if r.design.get("kind") == "sweep" and r.status == "completed"))')
          echo "replaying $EXP — exact reproducibility is asserted, timing is not"
          python -m origin replay --dir examples/flagship_run --exp "$EXP"

      - name: Relocated flagship mission verifies and replays
        run: |
          set -euo pipefail
          cp -r examples/flagship_run "$RUNNER_TEMP/relocated_mission"
          python -m origin verify --dir "$RUNNER_TEMP/relocated_mission"
          EXP=$(python -c 'from origin.state import ResearchState; st = ResearchState.load("examples/flagship_run"); print(next(r.id for r in st.experiments.values() if r.status == "completed"))')
          echo "replaying $EXP from the relocated copy"
          python -m origin replay --dir "$RUNNER_TEMP/relocated_mission" --exp "$EXP"

      - name: A copy without its own artifacts must FAIL verify (no phantom pass)
        run: |
          set -euo pipefail
          cp -r examples/flagship_run "$RUNNER_TEMP/gutted"
          rm -rf "$RUNNER_TEMP/gutted/experiments"
          if python -m origin verify --dir "$RUNNER_TEMP/gutted"; then
            echo "::error::verify passed on a mission with no artifacts"
            exit 1
          fi
          echo "verify correctly reported the missing artifacts"

      - name: Archive round-trip is independently usable
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=origin-project/ HEAD > "$RUNNER_TEMP/origin.zip"
          mkdir -p "$RUNNER_TEMP/extracted"
          unzip -q "$RUNNER_TEMP/origin.zip" -d "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted/origin-project"
          python tools/check_artifacts_portable.py .
          python -m unittest discover -s tests
          python -m origin verify --dir examples/flagship_run

  fresh-mission:
    name: end-to-end mission from a clean checkout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Init, run, verify, report
        run: |
          set -euo pipefail
          python -m origin init "CI smoke: which sort wins where?" \
            --dir "$RUNNER_TEMP/ci_mission" --profile fast --brain mock
          python -m origin run --dir "$RUNNER_TEMP/ci_mission"
          python -m origin verify --dir "$RUNNER_TEMP/ci_mission"
          python -m origin status --dir "$RUNNER_TEMP/ci_mission"
          python -m origin html --dir "$RUNNER_TEMP/ci_mission"
          python tools/check_artifacts_portable.py "$RUNNER_TEMP/ci_mission"
      - name: Web evidence pipeline (fixture mode, no network)
        run: |
          set -euo pipefail
          python tools/web_evidence_demo.py --dir "$RUNNER_TEMP/evidence" --mode fixture
          python -m origin verify --dir "$RUNNER_TEMP/evidence"
          python tools/check_artifacts_portable.py "$RUNNER_TEMP/evidence"

      - name: Bounded autonomy (fixture demo, no network)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_autonomy.py -v
          python tools/autonomy_demo.py --dir "$RUNNER_TEMP/autonomy"
          python -m origin verify --dir "$RUNNER_TEMP/autonomy"
          python -m origin autonomy status --dir "$RUNNER_TEMP/autonomy"
          python tools/check_artifacts_portable.py "$RUNNER_TEMP/autonomy"

      - name: Interrupt and resume
        run: |
          set -euo pipefail
          python -m origin init "CI interrupt test" \
            --dir "$RUNNER_TEMP/ci_resume" --profile fast --brain none
          python -m origin run --dir "$RUNNER_TEMP/ci_resume" --steps 2
          python -m origin run --dir "$RUNNER_TEMP/ci_resume"
          python -m origin verify --dir "$RUNNER_TEMP/ci_resume"

  web-boundary:
    name: public site + interactive boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Site, API, and worker integration tests
        run: >-
          python -m unittest tests.test_web_site tests.test_web_api
          tests.test_web_operations -v
      - name: Build static site from versioned evidence
        run: python tools/build_web.py --out build/web
      - name: Validate production Compose and TLS proxy configuration
        run: |
          set -euo pipefail
          mkdir -p deploy/secrets
          printf '%s\n' 'ci-beta-token-with-32-characters' > deploy/secrets/beta_token.txt
          printf '%s\n' 'ci-admin-token-with-32-characters' > deploy/secrets/admin_token.txt
          docker compose --env-file deploy/production.env.example \
            --file compose.production.yaml config >/tmp/origin-production-compose.yaml
          docker run --rm \
            --env ORIGIN_BETA_HOST=beta.example.test \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build the non-root beta container
        run: docker build --tag origin-beta:ci .
      - name: Smoke-test the containerized API boundary
        run: |
          set -euo pipefail
          docker run --detach --name origin-beta-ci \
            --publish 127.0.0.1:18080:8080 \
            --env ORIGIN_WEB_BETA_TOKEN=ci-beta-token-with-32-characters \
            --env ORIGIN_WEB_ADMIN_TOKEN=ci-admin-token-with-32-characters \
            origin-beta:ci
          trap 'docker rm --force origin-beta-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/v1/health >/tmp/origin-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/origin-health.json"))["status"] == "ok"'
          STATUS=$(curl --silent --output /tmp/origin-unauthorized.json \
            --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/missions)
          test "$STATUS" = "401"
          python tools/verify_beta_deployment.py \
            --api-origin http://127.0.0.1:18080 \
            --beta-token-file deploy/secrets/beta_token.txt \
            --admin-token-file deploy/secrets/admin_token.txt \
            --allow-http-local
          docker exec origin-beta-ci python -m origin_web.backup create \
            --data-dir /data --out /backup/ci-backup.tar.gz
          docker exec origin-beta-ci python -m origin_web.backup verify \
            --archive /backup/ci-backup.tar.gz
          docker exec origin-beta-ci python -m origin_web.backup restore \
            --archive /backup/ci-backup.tar.gz --target /restore
